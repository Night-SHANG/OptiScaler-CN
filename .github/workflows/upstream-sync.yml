name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve official upstream state
        id: upstream
        run: python tools/upstream_status.py --json-out reports/upstream-status.json --github-output "$GITHUB_OUTPUT"

      - name: Materialize official master for scan
        if: steps.upstream.outputs.branch_changed == 'true' || steps.upstream.outputs.stable_release_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python tools/prepare_tree.py --worktree _upstream --ref "${{ steps.upstream.outputs.branch_sha }}" --no-submodules

      - name: Scan current upstream UI
        if: steps.upstream.outputs.branch_changed == 'true' || steps.upstream.outputs.stable_release_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python tools/scan_ui.py --source _upstream --update --report reports/localization-scan.md

      - name: Optional incremental machine translation
        continue-on-error: true
        if: steps.upstream.outputs.branch_changed == 'true' || steps.upstream.outputs.stable_release_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TRANSLATION_API_URL: ${{ secrets.TRANSLATION_API_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
        run: python tools/translate_missing.py

      - name: Validate localization
        if: steps.upstream.outputs.branch_changed == 'true' || steps.upstream.outputs.stable_release_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python tools/check_localization.py --strict

      - name: Verify source integration anchors
        if: steps.upstream.outputs.branch_changed == 'true' || steps.upstream.outputs.stable_release_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          python tools/localize_source.py --source _upstream 2>&1 | tee reports/integration.log

      - name: Record successfully scanned upstream commit
        if: steps.upstream.outputs.branch_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python tools/upstream_status.py --set-scanned "${{ steps.upstream.outputs.branch_sha }}"

      - name: Persist localization metadata safely
        id: persist
        if: steps.upstream.outputs.branch_changed == 'true' || steps.upstream.outputs.stable_release_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Localization upstream.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Localization upstream.json
          git commit -m "chore: sync OptiScaler ${{ steps.upstream.outputs.branch_sha }}"
          # A non-fast-forward or branch-protection rejection is intentionally fatal.
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch clean master build
        if: steps.upstream.outputs.branch_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: gh workflow run build.yml --ref "${{ github.ref_name }}" -f upstream_ref="${{ steps.upstream.outputs.branch_sha }}"

      - name: Dispatch new stable release build
        if: steps.upstream.outputs.stable_release_changed == 'true'
        shell: bash
        run: gh workflow run release.yml --ref "${{ github.ref_name }}" -f upstream_ref="${{ steps.upstream.outputs.stable_tag }}" -f prerelease=false -f mark_stable=true

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: upstream-sync-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
